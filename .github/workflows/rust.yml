name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Prepare static probe tools
        run: |
          pip install ziglang==0.16.0
          cargo install cargo-zigbuild --version 0.23.4 --locked
          PSA_PREPARE_ONLY=1 scripts/package-probe.sh x86_64-unknown-linux-musl
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Offline query compilation and tests
        run: cargo test --locked --workspace
      - name: Lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Install matching SQLx CLI
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features sqlite
      - name: Check prepared queries against fresh migrations
        run: |
          export DATABASE_URL="sqlite://$(mktemp -d)/psa-schema.sqlite3"
          export SQLX_OFFLINE=false
          sqlx database create
          sqlx migrate run --source psa_server/migrations
          cargo sqlx prepare --check --workspace -- --all-targets
