[package]
name = "psa"
version = "0.1.0"
edition = "2024"

[dependencies]
llm_api = { path = "../llm_api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
time = { version = "0.3.55", features = ["serde-well-known"] }
reqwest = { version = "0.13.5", features = ["json", "stream", "query"] }
futures-util = "0.3"
eventsource-stream = "0.2"
thiserror = "2"

uuid = { version = "1", features = ["v4", "serde"] }
