[package]
name = "agent_trace"
version = "0.1.0"
edition = "2024"
description = "Harness-neutral agent session traces: format, storage, importers, and rendering."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.55", features = ["serde-well-known", "formatting", "parsing"] }
tokio = { version = "1", features = ["fs", "io-util"] }
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
