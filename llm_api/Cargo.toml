[package]
name = "llm_api"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.21"
base64 = "0.22"
httpdate = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
