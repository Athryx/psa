[package]
name = "psa_desktop"
version = "0.1.0"
edition = "2024"

[features]
default = ["native"]
native = ["dep:dioxus", "dep:dioxus-desktop"]

[[bin]]
name = "psa_desktop"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
client_shared = { path = "../client_shared" }
psa_config = { path = "../../runtime/psa_config" }
psa_gui = { path = "../psa_gui" }
dioxus = { version = "0.7.10", default-features = false, optional = true }
dioxus-desktop = { version = "0.7.10", optional = true }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt", "fs", "io-util", "sync"] }
toml = "0.9"

[dev-dependencies]
psa = { path = "../../lib/psa" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "fs"] }
