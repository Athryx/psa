[package]
name = "psa_cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "psa"
path = "src/main.rs"

[dependencies]
client_shared = { path = "../client_shared" }
llm_api = { path = "../../lib/llm_api" }
psa = { path = "../../lib/psa" }
psa_config = { path = "../../runtime/psa_config" }
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
toml = "0.9"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
