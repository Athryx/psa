[package]
name = "psa_gui"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "document"] }
client_shared = { path = "../client_shared" }
psa_api = { path = "../../psa_api" }
llm_api = { path = "../../lib/llm_api" }
futures-util = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
dioxus-html = { version = "=0.7.10", features = ["serialize"] }
dioxus-ssr = "=0.7.10"
