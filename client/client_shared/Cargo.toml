[package]
name = "client_shared"
version = "0.1.0"
edition = "2024"

[dependencies]
psa_api = { path = "../../psa_api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false }
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "rt", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
