[package]
name = "psa_components"
version = "0.1.0"
edition = "2024"

[dependencies]
actors = { path = "../../lib/actors" }
psa = { path = "../../lib/psa" }
psa_agents = { path = "../psa_agents" }
psa_config = { path = "../psa_config" }
psa_shared = { path = "../psa_shared" }
psa_store = { path = "../psa_store" }
psa_models = { path = "../psa_models" }
psa_codemode = { path = "../psa_codemode" }
llm_api = { path = "../../lib/llm_api" }
agent_trace = { path = "../../trace/agent_trace" }
time = "0.3.55"
serde_json = "1"
schemars = "1"
unicode-normalization = "0.1"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync", "time"] }
rand = "0.9"
tracing = "0.1"
thiserror = "2"
jsonschema = { version = "0.56", default-features = false }
futures-util = "0.3"

[dev-dependencies]
psa_agents = { path = "../psa_agents", features = ["testing"] }
psa_store = { path = "../psa_store", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
