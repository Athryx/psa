[package]
name = "psa_models"
version = "0.1.0"
edition = "2024"

[dependencies]
actors = { path = "../../lib/actors" }
llm_api = { path = "../../lib/llm_api" }
psa = { path = "../../lib/psa" }
psa_config = { path = "../psa_config" }
psa_shared = { path = "../psa_shared" }
psa_store = { path = "../psa_store" }
futures-util = "0.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3.55"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
toml_edit = "0.23"
tracing = "0.1"

[dev-dependencies]
axum = "0.8"
psa_store = { path = "../psa_store", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["net", "rt-multi-thread", "test-util"] }
