[package]
name = "psa_server"
version = "0.1.0"
edition = "2024"

[dependencies]
actors = { path = "../../lib/actors" }
psa = { path = "../../lib/psa" }
psa_config = { path = "../psa_config" }
psa_shared = { path = "../psa_shared" }
psa_store = { path = "../psa_store" }
psa_models = { path = "../psa_models" }
psa_codemode = { path = "../psa_codemode" }
psa_probe = { path = "../psa_probe" }
psa_agents = { path = "../psa_agents" }
psa_components = { path = "../psa_components" }
llm_api = { path = "../../lib/llm_api" }
time = "0.3.55"
serde_json = "1"
schemars = "1"
url = "2"
serde_yaml_ng = "0.10"
sha2 = "0.10"
subtle = "2.6.1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "net", "signal", "io-util", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
toml = "0.9"
axum = { version = "0.8", features = ["ws"] }
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
futures-util = "0.3"
async-stream = "0.3"
reqwest = { version = "0.13.5", features = ["json"] }

[dev-dependencies]
psa_agents = { path = "../psa_agents", features = ["testing"] }
client_shared = { path = "../../client/client_shared" }
psa_store = { path = "../psa_store", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio-tungstenite = "0.29"
