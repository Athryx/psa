[package]
name = "psa_agents"
version = "0.1.0"
edition = "2024"

[features]
# Test fakes and fixtures for crates that test against the runtime.
testing = ["dep:tempfile", "psa_store/test-support"]

[dependencies]
actors = { path = "../../lib/actors" }
psa = { path = "../../lib/psa" }
psa_config = { path = "../psa_config" }
psa_shared = { path = "../psa_shared" }
psa_store = { path = "../psa_store" }
psa_models = { path = "../psa_models" }
psa_codemode = { path = "../psa_codemode" }
llm_api = { path = "../../lib/llm_api" }
time = "0.3.55"
serde_json = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync", "time"] }
tracing = "0.1"
thiserror = "2"
futures-util = "0.3"
tempfile = { version = "3", optional = true }

[dev-dependencies]
psa_store = { path = "../psa_store", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
