[package]
name = "psa_codemode"
version = "0.1.0"
edition = "2024"

[dependencies]
psa_shared = { path = "../psa_shared" }
psa_store = { path = "../psa_store" }
futures-util = "0.3"
monty-pool = "=1.4.0"
monty-types = "=1.4.0"
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
